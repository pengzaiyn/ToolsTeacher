<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Trường Cao đẳng Việt Mỹ Hà Nội</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('avc_theme_mode_v1') || 'light';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
          var rawGlass = localStorage.getItem('avc_glass_effect_v1');
          if (rawGlass) {
            var glass = JSON.parse(rawGlass);
            var validModes = { frosted: true, liquid: true };
            var validLevels = { subtle: true, medium: true, strong: true };
            if (glass && validModes[glass.mode]) {
              var level = validLevels[glass.intensity] ? glass.intensity : 'medium';
              var root = document.documentElement;
              root.classList.add('glass-active', 'glass-' + glass.mode, 'glass-' + level);
              if (glass.ambientGlow !== false) {
                root.classList.add('glass-ambient');
              }
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface-page font-sans text-ink-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
