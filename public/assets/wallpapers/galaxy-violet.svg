<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09071A" />
      <stop offset="50%" stop-color="#1E103C" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <radialGradient id="nebulaA" cx="30%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#09071A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaB" cx="72%" cy="62%" r="45%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.34" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#09071A" stop-opacity="0" />
    </radialGradient>
    <filter id="nebBlur">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#spaceBg)" />
  <rect width="1600" height="900" fill="url(#nebulaA)" />
  <rect width="1600" height="900" fill="url(#nebulaB)" />

  <!-- Dải ngân hà chéo -->
  <g filter="url(#nebBlur)" opacity="0.45">
    <ellipse cx="800" cy="460" rx="720" ry="150" transform="rotate(-22 800 460)" fill="#8B5CF6" />
    <ellipse cx="840" cy="450" rx="520" ry="85" transform="rotate(-22 840 450)" fill="#F472B6" opacity="0.55" />
  </g>

  <!-- Hành tinh vòng tròn tối giản góc trên phải -->
  <circle cx="1290" cy="210" r="46" fill="#C084FC" opacity="0.72" />
  <ellipse cx="1290" cy="212" rx="92" ry="18" transform="rotate(-18 1290 212)" fill="none" stroke="#E9D5FF" stroke-width="4" opacity="0.65" />

  <!-- Sao đêm -->
  <g fill="#FFFFFF" opacity="0.82">
    <circle cx="130" cy="140" r="2.2" /><circle cx="290" cy="95" r="1.5" /><circle cx="440" cy="210" r="2.4" />
    <circle cx="610" cy="130" r="1.8" /><circle cx="770" cy="240" r="2.1" /><circle cx="940" cy="115" r="1.6" />
    <circle cx="1090" cy="180" r="2.5" /><circle cx="1470" cy="120" r="1.9" /><circle cx="210" cy="410" r="1.7" />
    <circle cx="380" cy="540" r="2.2" /><circle cx="560" cy="470" r="1.5" /><circle cx="720" cy="610" r="2.3" />
    <circle cx="910" cy="530" r="1.8" /><circle cx="1120" cy="660" r="2.1" /><circle cx="1340" cy="520" r="1.6" />
    <circle cx="1480" cy="720" r="2.4" /><circle cx="190" cy="760" r="2.0" /><circle cx="470" cy="790" r="1.7" />
  </g>
</svg>
