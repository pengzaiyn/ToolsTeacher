<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#BAE6FD" />
      <stop offset="80%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#FBCFE8" />
    </linearGradient>
    <radialGradient id="sun" cx="24%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#FEF3C7" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hills1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#F5D0FE" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="hills2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0.42" />
    </linearGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="lightBlur">
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <g id="blossom">
      <circle cx="0" cy="-12" r="9" fill="#FBCFE8" />
      <circle cx="11" cy="-4" r="9" fill="#F9A8D4" />
      <circle cx="7" cy="10" r="9" fill="#FBCFE8" />
      <circle cx="-7" cy="10" r="9" fill="#F9A8D4" />
      <circle cx="-11" cy="-4" r="9" fill="#FCE7F3" />
      <circle cx="0" cy="0" r="4" fill="#F43F5E" opacity="0.65" />
    </g>
    <g id="petal">
      <path d="M0,-8 C6,-5 8,4 0,10 C-8,4 -6,-5 0,-8 Z" fill="#F9A8D4" />
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />
  <rect width="1600" height="900" fill="url(#sun)" />

  <!-- Mây sáng mềm -->
  <g filter="url(#softBlur)" opacity="0.75">
    <ellipse cx="420" cy="460" rx="340" ry="70" fill="#FFFFFF" />
    <ellipse cx="1120" cy="390" rx="380" ry="85" fill="#FFF1F2" />
    <ellipse cx="820" cy="560" rx="460" ry="90" fill="#FFFFFF" opacity="0.65" />
  </g>

  <!-- Dãy đồi xa -->
  <path d="M0 720 Q280 610 560 690 T1120 670 T1600 710 L1600 900 L0 900 Z" fill="url(#hills1)" />
  <path d="M0 780 Q360 700 740 770 T1360 740 L1600 770 L1600 900 L0 900 Z" fill="url(#hills2)" />

  <!-- Cành hoa anh đào bên trái & phải trên -->
  <g stroke="#5B3A42" stroke-linecap="round" fill="none">
    <path d="M-40 160 Q220 120 460 190 Q600 230 700 185" stroke-width="18" />
    <path d="M180 140 Q320 65 500 55" stroke-width="10" />
    <path d="M360 175 Q440 245 560 270" stroke-width="8" />
    <path d="M1640 110 Q1360 140 1140 85 Q990 45 900 110" stroke-width="16" />
    <path d="M1380 118 Q1250 190 1110 210" stroke-width="9" />
  </g>

  <!-- Chùm hoa trên cành -->
  <g filter="url(#lightBlur)" opacity="0.55">
    <circle cx="140" cy="135" r="72" fill="#F9A8D4" />
    <circle cx="310" cy="115" r="85" fill="#FBCFE8" />
    <circle cx="480" cy="160" r="68" fill="#F472B6" />
    <circle cx="1360" cy="105" r="84" fill="#F9A8D4" />
    <circle cx="1160" cy="95" r="70" fill="#FBCFE8" />
  </g>

  <g>
    <use href="#blossom" transform="translate(110 115) scale(1.6)" />
    <use href="#blossom" transform="translate(190 165) scale(1.3)" />
    <use href="#blossom" transform="translate(275 88) scale(1.5)" />
    <use href="#blossom" transform="translate(360 135) scale(1.4)" />
    <use href="#blossom" transform="translate(455 70) scale(1.2)" />
    <use href="#blossom" transform="translate(490 185) scale(1.5)" />
    <use href="#blossom" transform="translate(565 255) scale(1.1)" />
    <use href="#blossom" transform="translate(665 182) scale(1.25)" />

    <use href="#blossom" transform="translate(1480 110) scale(1.7)" />
    <use href="#blossom" transform="translate(1360 132) scale(1.5)" />
    <use href="#blossom" transform="translate(1260 80) scale(1.4)" />
    <use href="#blossom" transform="translate(1145 102) scale(1.6)" />
    <use href="#blossom" transform="translate(1120 198) scale(1.2)" />
    <use href="#blossom" transform="translate(970 95) scale(1.35)" />
  </g>

  <!-- Cánh hoa bay nhẹ trong gió -->
  <g opacity="0.88">
    <use href="#petal" transform="translate(290 310) rotate(32) scale(1.1)" />
    <use href="#petal" transform="translate(540 370) rotate(-45) scale(0.9)" />
    <use href="#petal" transform="translate(760 240) rotate(68) scale(1.0)" />
    <use href="#petal" transform="translate(940 340) rotate(-25) scale(0.85)" />
    <use href="#petal" transform="translate(1190 310) rotate(52) scale(1.15)" />
    <use href="#petal" transform="translate(1390 430) rotate(-60) scale(1.0)" />
    <use href="#petal" transform="translate(420 560) rotate(22) scale(0.95)" />
    <use href="#petal" transform="translate(1050 610) rotate(-38) scale(1.1)" />
    <use href="#petal" transform="translate(170 620) rotate(40) scale(1.2)" />
    <use href="#petal" transform="translate(1470 670) rotate(-20) scale(1.05)" />
  </g>
</svg>
