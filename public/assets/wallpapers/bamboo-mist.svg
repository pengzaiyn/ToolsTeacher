<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mistSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="50%" stop-color="#D1FAE5" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
    <radialGradient id="morningGlow" cx="76%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#FEF3C7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D1FAE5" stop-opacity="0" />
    </radialGradient>
    <filter id="softFog">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#mistSky)" />
  <rect width="1600" height="900" fill="url(#morningGlow)" />

  <!-- Thân trúc mờ xa -->
  <g stroke="#047857" stroke-opacity="0.16" stroke-linecap="round">
    <line x1="180" y1="0" x2="195" y2="900" stroke-width="18" />
    <line x1="250" y1="0" x2="238" y2="900" stroke-width="12" />
    <line x1="1360" y1="0" x2="1340" y2="900" stroke-width="20" />
    <line x1="1450" y1="0" x2="1470" y2="900" stroke-width="14" />
    <line x1="1260" y1="0" x2="1275" y2="900" stroke-width="10" />
  </g>

  <!-- Lá trúc nhẹ -->
  <g fill="#059669" fill-opacity="0.24">
    <ellipse cx="220" cy="180" rx="52" ry="12" transform="rotate(-24 220 180)" />
    <ellipse cx="270" cy="215" rx="46" ry="11" transform="rotate(18 270 215)" />
    <ellipse cx="1310" cy="140" rx="56" ry="12" transform="rotate(28 1310 140)" />
    <ellipse cx="1395" cy="195" rx="50" ry="11" transform="rotate(-20 1395 195)" />
    <ellipse cx="1220" cy="260" rx="44" ry="10" transform="rotate(22 1220 260)" />
  </g>

  <!-- Sương mù buổi sớm -->
  <g filter="url(#softFog)" opacity="0.72" fill="#FFFFFF">
    <ellipse cx="420" cy="690" rx="480" ry="95" />
    <ellipse cx="1180" cy="740" rx="520" ry="110" />
  </g>
</svg>
