<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cosmos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0A28" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <radialGradient id="nebula" cx="55%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0F0A28" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="warmLamp" cx="18%" cy="76%" r="36%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#EA580C" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0F0A28" stop-opacity="0" />
    </radialGradient>
    <filter id="glowSoft">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#cosmos)" />
  <rect width="1600" height="900" fill="url(#nebula)" />
  <rect width="1600" height="900" fill="url(#warmLamp)" />

  <!-- Trăng lưỡi liềm & sao -->
  <circle cx="1160" cy="240" r="68" fill="#FEF08A" opacity="0.18" filter="url(#glowSoft)" />
  <path d="M1185 182 C1132 186 1102 238 1124 285 C1142 322 1188 336 1222 318 C1178 346 1112 330 1086 280 C1060 228 1088 170 1148 164 C1162 164 1175 170 1185 182 Z" fill="#FEF9C3" opacity="0.92" />

  <g fill="#F8FAFC" opacity="0.78">
    <circle cx="380" cy="180" r="2.2" /><circle cx="510" cy="120" r="1.5" /><circle cx="640" cy="230" r="2.5" />
    <circle cx="770" cy="145" r="1.8" /><circle cx="890" cy="210" r="2.1" /><circle cx="980" cy="110" r="1.4" />
    <circle cx="1320" cy="140" r="2.2" /><circle cx="1410" cy="290" r="1.7" /><circle cx="440" cy="360" r="1.8" />
    <circle cx="690" cy="390" r="2.0" /><circle cx="940" cy="430" r="1.6" /><circle cx="1270" cy="420" r="2.1" />
  </g>

  <!-- Dây đèn vàng ấm rủ trên vòm cửa -->
  <path d="M220 40 Q540 160 800 95 Q1100 185 1380 45" fill="none" stroke="#FDE68A" stroke-opacity="0.35" stroke-width="2" />
  <g fill="#FDE047">
    <circle cx="360" cy="95" r="4" /><circle cx="520" cy="122" r="4.5" /><circle cx="680" cy="114" r="4" />
    <circle cx="940" cy="126" r="4.5" /><circle cx="1120" cy="136" r="4" /><circle cx="1270" cy="98" r="4" />
  </g>

  <!-- Khung vòm cửa sổ & giá sách hai bên -->
  <path d="M0 0 H1600 V900 H0 Z M260 900 V360 A540 310 0 0 1 1340 360 V900 Z" fill="#0B081D" fill-rule="evenodd" opacity="0.82" />
  <path d="M260 900 V360 A540 310 0 0 1 1340 360 V900" fill="none" stroke="#312E81" stroke-width="8" opacity="0.7" />
  <line x1="800" y1="50" x2="800" y2="900" stroke="#1E1B4B" stroke-width="6" opacity="0.55" />
  <line x1="260" y1="540" x2="1340" y2="540" stroke="#1E1B4B" stroke-width="6" opacity="0.55" />

  <!-- Đồi xa & ánh đèn dưới cửa sổ -->
  <path d="M260 760 Q580 710 860 755 T1340 735 V900 H260 Z" fill="#13102E" opacity="0.88" />
</svg>
