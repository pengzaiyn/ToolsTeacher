<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="32%" stop-color="#9D174D" />
      <stop offset="68%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <radialGradient id="sunsetSun" cx="50%" cy="68%" r="45%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#FDBA74" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
    </radialGradient>
    <filter id="cloudBlur">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sunsetSky)" />
  <rect width="1600" height="900" fill="url(#sunsetSun)" />
  <circle cx="800" cy="610" r="120" fill="#FEF9C3" opacity="0.92" />

  <!-- Mây hoàng hôn -->
  <g filter="url(#cloudBlur)" opacity="0.65">
    <ellipse cx="360" cy="310" rx="280" ry="42" fill="#F472B6" />
    <ellipse cx="1230" cy="270" rx="310" ry="48" fill="#FB923C" />
    <ellipse cx="640" cy="440" rx="340" ry="38" fill="#FDBA74" />
  </g>

  <!-- Đường chân trời thành phố & mái nhà -->
  <path d="M0 735 H180 V660 H260 V710 H360 V625 H440 V715 H600 V680 H690 V740 H960 V640 H1060 V715 H1170 V600 H1280 V725 H1400 V655 H1500 V720 H1600 V900 H0 Z" fill="#1E1B4B" opacity="0.88" />
  <path d="M0 780 Q400 745 820 785 T1600 765 V900 H0 Z" fill="#0F172A" opacity="0.92" />

  <!-- Đèn cửa sổ nhỏ xa xa -->
  <g fill="#FEF08A" opacity="0.72">
    <rect x="385" y="655" width="8" height="10" /><rect x="405" y="655" width="8" height="10" />
    <rect x="1195" y="635" width="9" height="12" /><rect x="1220" y="635" width="9" height="12" />
    <rect x="1245" y="665" width="9" height="12" /><rect x="990" y="670" width="8" height="10" />
  </g>
</svg>
